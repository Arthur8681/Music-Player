<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Register</title>
    <style>body { max-width: 400px; margin: 60px auto; background: #151515; color: white; font-family: Arial; padding: 20px; }</style>
</head>
<body>
    <h2>Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background:#4ff165; padding:10px; border:none; border-radius:6px; cursor:pointer;">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}" style="color:#4ff165;">Log in</a></p>
</body>
</html>
